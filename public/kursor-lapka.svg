<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!--
    Kursor widgetu Emmbotka — lapka zwierzatka.

    Konwencja wzieta z kursora strony (`kursor-koniczyna.svg`): 40x40, bo przy 32 px
    kreska potrzebna do czytelnosci zjada wnetrza ksztaltow. Chrome, Firefox i Edge
    przyjmuja kursory do 128 px, wiec 40 jest bezpieczne.

    Rozne od koniczyny jest wypelnienie: koniczyna to sam kontur, ale lapka musi byc
    czytelna zarowno na jasnym tle rozmowy, jak i na ciemnym naglowku panelu. Stad
    zielen marki w srodku i biala obwodka dookola - biel odcina ksztalt od ciemnego
    tla, zielen od jasnego.

    Punkt aktywny (hotspot) ustawiony w CSS na 12 8: mniej wiecej czubek gornego
    lewego palca, zeby klikniecie trafialo tam, gdzie uzytkownik celuje.
  -->
  <g fill="#129245" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round">
    <!-- palce: cztery owalne opuszki, lekko rozchylone jak w prawdziwej lapce -->
    <ellipse cx="12.6" cy="12.4" rx="4.05" ry="5.15" transform="rotate(-16 12.6 12.4)"/>
    <ellipse cx="20.4" cy="9.9"  rx="4.05" ry="5.35" transform="rotate(-4 20.4 9.9)"/>
    <ellipse cx="28.1" cy="12.1" rx="4.05" ry="5.15" transform="rotate(13 28.1 12.1)"/>
    <ellipse cx="33.3" cy="19.2" rx="3.75" ry="4.6"  transform="rotate(28 33.3 19.2)"/>
    <!-- glowna poduszka: zaokraglony trapez z lekkim wcieciem u dolu -->
    <path d="M20.3 17.6c4.9 0 9.4 3.1 10.7 7.2 1.2 3.9-1.3 7.6-5.3 8.2-2 .3-3.4-.5-5.4-.5s-3.4.8-5.4.5c-4-.6-6.5-4.3-5.3-8.2 1.3-4.1 5.8-7.2 10.7-7.2z"/>
  </g>
</svg>
